# Round-bottom flask (RBF) scrape with set TCP speeds (mm/s), the vial scrape's moves on a curved wall. Made by the
# same code as SETUP > Flask > Make program, for a round-bottom flask with a wide neck (82 mm inside the bulb, 40 mm
# bore, 50 mm neck) and a long straight spatula (3 mm shaft radius, 300 mm long).
# 24 strokes, 15 deg apart all the way round. Each stroke starts as high up the wall as a straight tool reaches
# through the neck (75 deg from the bottom, 30 mm above it, 40 mm out from the axis) and follows the round wall down
# to the bottom in 5 deg steps (16 poses).
# The neck: the shaft passes through the bore and keeps the 1 mm margin to it at both ends of the neck (pitch:
# automatic). Only the spatula's end lies on the glass. Higher up (about 80 deg) no straight line fits through this
# neck: the upper part of the bulb needs a bent tool or a wider neck. In SETUP > Flask
# the pitch (tilt from vertical, at the top and the bottom of a stroke) can be set instead; Check reach shows what the
# neck and the glass block.
# Per stroke, as the vial: down the shaft line to 5 mm short of the wall, onto the wall, press 3 N, 0.5 s, scrape
# down, release, 0.25 s, back out to the middle of the neck, turn to the next stroke. The press is along the wall's
# normal at each point (a force step before each move): mostly along the tool at the top of a stroke, straight down
# at the bottom, so the tool stays on the curved wall.
# F/T is zeroed in free air above the neck (Position mode), then Admittance for the scrape.
# Speeds: into the neck, between strokes and out at 15 mm/s; onto the wall and down it at 5 mm/s. The first move to
# the neck is a joint move (no mm/s).
# FIRST: SETUP > Flask: touch your flask and Save, so the fixture "flask" exists. If your flask or tool is not
# this one, make the program there instead (Make program, set mm/s): these poses only fit this flask (a narrower
# neck blocks the upper part: a 24 mm bore reaches 37 deg).
# TCP: the poses use `tcp: active`: select your spatula tip TCP (top bar).
# BEFORE THE ROBOT: watch the preview, set Admittance compliance, run with SPEED at 25 % first and read the MoveL
# lines in the log.
version: 2
name: example_rbf_scrape_speed
robot: ur7e_lab
waypoints:
  approach_neck:
    pose:
      frame: flask
      tcp: active
      position: [0.0, 0.0, 0.136661]
      quat_xyzw: [1.0, 0.0, 0.0, 0.0]
