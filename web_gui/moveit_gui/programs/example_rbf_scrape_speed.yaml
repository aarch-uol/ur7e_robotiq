# Round-bottom flask (RBF) scrape with set TCP speeds (mm/s). Made by the same code as SETUP > Flask > Make
# program (pattern Top to bottom), for a 250 ml flask (85 mm bulb, 27 mm neck) and a straight spatula (3 mm shaft
# radius, 150 mm long). Like the vial scrape it scrapes DOWN the wall: 12 strokes, 30 deg apart around the axis,
# each from 17 deg down to 12 and 6 deg from the bottom (17 deg is the most a straight tool reaches through the
# neck). Per stroke: in through the neck to the top of the stroke, press, scrape down, release, back out to the neck.
# Speeds: into the neck, between strokes and out at 15 mm/s; down the wall (the scrape) at 5 mm/s with 3 N pressed
# along the tool (Admittance). The first move to the neck is a joint move (no mm/s).
# FIRST: SETUP > Flask: touch your flask and Save, so the fixture "flask" exists. If your flask or tool is not
# this one, make the program there instead (Make program, set mm/s): these poses only fit a 250 ml flask.
# TCP: the poses use `tcp: active`: select your spatula tip TCP (top bar).
# BEFORE THE ROBOT: watch the preview, run with SPEED at 25 % first, and read the MoveL lines in the log
# (each one says the speed it got, and if the joint limits slowed it).
version: 2
name: example_rbf_scrape_speed
robot: ur7e_lab
