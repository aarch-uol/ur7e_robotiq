# MoveIt uses this configuration for controller management. Points at the
# controllers drivers.launch.py already runs (both controller_managers) —
# this package starts no controllers of its own.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01
  execution_duration_monitoring: false # May lead to unexpectedly aborted goals with scaled JTC

moveit_simple_controller_manager:
  controller_names:
    - scaled_joint_trajectory_controller
    - robotiq_gripper_controller

  scaled_joint_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

  # /robotiq_controller_manager, not /controller_manager — a different
  # controller_manager than the arm's, but MoveItSimpleControllerManager
  # addresses controllers by name/action namespace, not by manager, so this
  # needs no special handling here.
  robotiq_gripper_controller:
    action_ns: gripper_cmd
    type: ParallelGripperCommand
    default: true
    joints:
      - robotiq_85_left_knuckle_joint
    max_effort: 40.0
