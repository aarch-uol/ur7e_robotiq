# GUI bringup: MoveIt knows both arm trajectory controllers at once. Which one a trajectory uses is
# chosen per goal: the GUI names the active mode's controller in ExecuteTrajectory.controller_names.
# A goal with no controller named (RViz Plan & Execute) uses the default, scaled_joint_trajectory_controller,
# and the inactive controller rejects it when the robot is in admittance, so it fails instead of moving.
#
# MoveItSimpleControllerManager reports every listed controller as active and never switches anything,
# which is what the GUI needs: ros2_control switching stays in one place. Ros2ControlManager was not used:
# it talks to a single controller manager, and the gripper runs on its own.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01
  execution_duration_monitoring: false # May lead to unexpectedly aborted goals with scaled JTC

moveit_simple_controller_manager:
  controller_names:
    - scaled_joint_trajectory_controller
    - admittance_trajectory_controller
    - robotiq_gripper_controller

  scaled_joint_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints: &arm_joints
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

  admittance_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: false
    joints: *arm_joints

  robotiq_gripper_controller:
    action_ns: gripper_cmd
    type: ParallelGripperCommand
    default: true
    joints:
      - robotiq_85_left_knuckle_joint
    max_effort: 40.0
