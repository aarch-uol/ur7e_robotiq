# These limits are used by MoveIt and augment/override the definitions in the URDF.
#
# The arm entries are ur_moveit_config's own (copied as-is): MoveIt needs
# acceleration limits for time parametrization that the robot itself doesn't
# expose. gripper_max_speed (0.150 m/s) from robotiq_2f85_control.urdf.xacro
# gives the velocity limit below; acceleration is a conservative guess (the
# gripper has no published figure) tightened here rather than left at
# MoveIt's default (~2x the URDF velocity limit, which starts every gripper
# trajectory far too aggressively).

joint_limits:
  shoulder_pan_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  shoulder_lift_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  elbow_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_1_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_2_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_3_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  robotiq_85_left_knuckle_joint:
    has_velocity_limits: true
    max_velocity: 0.150
    has_acceleration_limits: true
    max_acceleration: 1.0
